# PR into develop: only a release branch may merge here (ADR 0007).
# Checks: version, format, lint, types, unit tests, then the E2E suite (ADR 0008).
# One job to stay within GitHub Free minutes (.claude/rules/ci.md).
name: PR → develop

on:
  pull_request:
    branches: [develop]
    # `edited` catches a PR retargeted to develop; title/body edits are skipped below.
    types: [opened, synchronize, reopened, edited]

concurrency:
  # Per workflow and PR. A title/body edit gets its own group so it cannot
  # cancel a running check (its job is skipped anyway).
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.action == 'edited' && github.event.changes.base == null && 'edit' || 'run' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    # Unit tests ~4 min on the 2-core runner, E2E ~3–5 more (ADR 0008); room
    # until the first real runs show the numbers.
    timeout-minutes: 20
    steps:
      - name: Require a release/X.Y.Z head branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            gh pr comment "$PR" --repo "$REPO" --body "Only \`release/X.Y.Z\` branches can be merged into \`develop\` (ADR 0007). Open this PR against its release branch instead."
            gh pr close "$PR" --repo "$REPO"
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Version check
        # GITHUB_HEAD_REF is set by Actions on pull_request events.
        run: node scripts/check-version.ts

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # E2E (ADR 0008): Chromium only, the browser cached by Playwright's version.
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Next's build cache (the Next docs' advice for CI): later builds reuse it.
      - name: Cache the Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'app/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Builds the app and starts it on :3100 (playwright.config.ts). Its own
      # limit, so a hang fails this step and the report below is still uploaded.
      - run: pnpm e2e
        timeout-minutes: 10

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
