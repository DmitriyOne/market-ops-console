# PR into develop: only a release branch may merge here (ADR 0007).
# Branch and version first; then format, lint, types, unit tests and the E2E
# suite (ADR 0008) in parallel, each its own check in the PR.
name: PR → develop

on:
  pull_request:
    branches: [develop]
    # `edited` catches a PR retargeted to develop; title/body edits are skipped below.
    types: [opened, synchronize, reopened, edited]

concurrency:
  # Per workflow and PR. A title/body edit gets its own group so it cannot
  # cancel a running check (its jobs are skipped anyway).
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.action == 'edited' && github.event.changes.base == null && 'edit' || 'run' }}
  cancel-in-progress: true

permissions:
  contents: read

# One job per check so each has its own line and log in the PR (owner,
# 2026-11-05). Every job after `gate` installs on its own: ~13 billed minutes
# a run instead of ~8, ~4.5 minutes to wait instead of ~7.5 (.claude/rules/ci.md).
jobs:
  gate:
    name: Branch & version
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Require a release/X.Y.Z head branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            gh pr comment "$PR" --repo "$REPO" --body "Only \`release/X.Y.Z\` branches can be merged into \`develop\` (ADR 0007). Open this PR against its release branch instead."
            gh pr close "$PR" --repo "$REPO"
            exit 1
          fi

      # This job's token can comment and close: keep it out of the checkout.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # No install: the script runs on Node's own type stripping.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Version check
        # GITHUB_HEAD_REF is set by Actions on pull_request events.
        run: node scripts/check-version.ts

  # The checks below wait for the gate: a wrong branch or version starts nothing.
  format:
    name: Format
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  lint:
    name: Lint
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm lint

  types:
    name: Types
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit:
    name: Unit tests
    needs: gate
    runs-on: ubuntu-latest
    # ~3 min on the 2-core runner (ADR 0007).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm test

  e2e:
    name: E2E
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # Chromium only, the browser cached by Playwright's version (ADR 0008).
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Next's build cache (the Next docs' advice for CI): later builds reuse it.
      - name: Cache the Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'app/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Builds the app and starts it on :3100 (playwright.config.ts). Its own
      # limit, so a hang fails this step and the report below is still uploaded.
      - run: pnpm e2e
        timeout-minutes: 10

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
