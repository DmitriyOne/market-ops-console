# The setup every check job repeats: pnpm, Node from .nvmrc with the pnpm
# store cached by the lockfile, then a frozen install. Run after checkout.
name: Setup
description: pnpm, Node (.nvmrc) with the pnpm cache, frozen install

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
